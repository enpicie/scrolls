name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

      # Vercel deploys automatically via GitHub integration on push to main.
      # This workflow runs pre-deploy checks and is the hook for future steps
      # (e.g. supabase db push --linked for automated migrations).
